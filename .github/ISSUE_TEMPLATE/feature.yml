name: Feature idea
description: Something you'd like A9 Voice to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **Never paste API keys, tokens or your settings.json.**
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
