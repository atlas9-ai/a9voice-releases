<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Edge's Downloads panel, in two steps</title>
  <desc id="d">A mock-up of Edge's Downloads panel. First, the installer is listed with a note that it isn't commonly downloaded, and the menu behind its three dots offers Keep. Then a box asks you to confirm, and the arrow on its Delete button offers Keep anyway. The file name is A9Voice_ and the version, then _x64-setup.exe.</desc>
  <rect width="720" height="300" rx="16" fill="#17181B"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="24" y="24" width="324" height="252" rx="12" fill="#1E1F23" stroke="#34363C"/>
    <text x="44" y="52" font-size="14" font-weight="600" fill="#ECEDEE">Downloads</text>
    <rect x="36" y="64" width="300" height="68" rx="8" fill="#26272C"/>
    <text x="50" y="86" font-size="11.5" fill="#ECEDEE">A9Voice_x.y.z_x64-setup.exe isn't</text>
    <text x="50" y="102" font-size="11.5" fill="#ECEDEE">commonly downloaded. Make sure you trust</text>
    <text x="50" y="118" font-size="11.5" fill="#ECEDEE">A9Voice_x.y.z_x64-setup.exe before you open it.</text>
    <circle cx="304" cy="76" r="1.8" fill="#C9CBD0"/><circle cx="312" cy="76" r="1.8" fill="#C9CBD0"/><circle cx="320" cy="76" r="1.8" fill="#C9CBD0"/>
    <rect x="176" y="138" width="160" height="104" rx="8" fill="#26272C" stroke="#34363C"/>
    <text x="192" y="156" font-size="12" fill="#ECEDEE">Delete</text>
    <rect x="182" y="164" width="148" height="24" rx="6" fill="#2B5BD7"/>
    <text x="192" y="180" font-size="12" font-weight="600" fill="#FFFFFF">Keep</text>
    <text x="192" y="204" font-size="12" fill="#C9CBD0">Report this file as safe</text>
    <text x="192" y="226" font-size="12" fill="#C9CBD0">Learn more</text>
    <text x="44" y="266" font-size="11.5" fill="#9A9DA4">1  The three dots: Keep</text>
    <rect x="372" y="24" width="324" height="252" rx="12" fill="#1E1F23" stroke="#34363C"/>
    <text x="392" y="52" font-size="14" font-weight="600" fill="#ECEDEE">Make sure you trust</text>
    <text x="392" y="70" font-size="14" font-weight="600" fill="#ECEDEE">A9Voice_x.y.z_x64-setup.exe</text>
    <text x="392" y="88" font-size="14" font-weight="600" fill="#ECEDEE">before you open it</text>
    <text x="392" y="112" font-size="11" fill="#9A9DA4">Microsoft Defender SmartScreen couldn't verify if</text>
    <text x="392" y="127" font-size="11" fill="#9A9DA4">this file is safe because it isn't commonly</text>
    <text x="392" y="142" font-size="11" fill="#9A9DA4">downloaded. Make sure you trust the file.</text>
    <text x="392" y="166" font-size="11" fill="#9A9DA4">Name: A9Voice_x.y.z_x64-setup.exe</text>
    <text x="392" y="182" font-size="11" fill="#9A9DA4">Publisher: Unknown</text>
    <rect x="530" y="206" width="62" height="28" rx="8" fill="none" stroke="#34363C"/>
    <text x="561" y="224" text-anchor="middle" font-size="12" fill="#ECEDEE">Cancel</text>
    <rect x="600" y="206" width="76" height="28" rx="8" fill="#ECEDEE"/>
    <text x="628" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#0B0C0E">Delete</text>
    <path d="M656 218l4 4 4-4" fill="none" stroke="#0B0C0E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="560" y="238" width="116" height="26" rx="6" fill="#2B5BD7"/>
    <text x="618" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Keep anyway</text>
    <text x="392" y="266" font-size="11.5" fill="#9A9DA4">2  The arrow on Delete</text>
  </g>
</svg>
